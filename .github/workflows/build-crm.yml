name: Build CRM Alunos

on:
  push:
    branches: [main]
    paths:
      - "CRM-Alunos/**"
  pull_request:
    branches: [main]
    paths:
      - "CRM-Alunos/**"

jobs:
  build:
    name: Build WPF Project
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore CRM-Alunos/CRM-Alunos/CRM-Alunos.csproj
        shell: pwsh

      - name: Build CRM Alunos
        run: dotnet build CRM-Alunos/CRM-Alunos/CRM-Alunos.csproj --no-restore -c Release
        shell: pwsh

      - name: Verify build output
        shell: pwsh
        run: |
          $outputDir = "CRM-Alunos/CRM-Alunos/bin/Release/net8.0-windows"
          $exePath = "$outputDir/CRM-Alunos.exe"

          if (Test-Path $exePath) {
            $fileInfo = Get-Item $exePath
            $sizeMB = [math]::Round($fileInfo.Length / 1MB, 2)
            Write-Host "Build output verified: $exePath ($sizeMB MB)"
            echo "## Build Output Verified" >> $env:GITHUB_STEP_SUMMARY
            echo "- **Executable**: CRM-Alunos.exe" >> $env:GITHUB_STEP_SUMMARY
            echo "- **Size**: $sizeMB MB" >> $env:GITHUB_STEP_SUMMARY
            echo "- **Location**: $outputDir" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Error "Build output not found at $exePath"
            exit 1
          }

      - name: Report build status
        if: always()
        shell: pwsh
        run: |
          $status = "${{ job.status }}"
          $icon = if ($status -eq "success") { "✅" } else { "❌" }
          $repo = "${{ github.repository }}"
          $run_id = "${{ github.run_id }}"
          $sha = "${{ github.sha }}"
          $short_sha = $sha.Substring(0, 7)
          $actor = "${{ github.actor }}"
          $ref_name = "${{ github.ref_name }}"

          $summary = @"
          ## $icon Build CRM Alunos - $status

          | Detail | Value |
          |--------|-------|
          | **Repository** | $repo |
          | **Branch** | $ref_name |
          | **Commit** | ``$short_sha`` |
          | **Triggered by** | $actor |
          | **Run ID** | [$run_id](https://github.com/$repo/actions/runs/$run_id) |

          ### Build Information
          - **Project**: CRM-Alunos/CRM-Alunos/CRM-Alunos.csproj
          - **Framework**: net8.0-windows
          - **Configuration**: Release
          - **Target**: WPF (.NET 8)

          $(if ($status -eq "success") { "The build completed successfully. All checks passed." } else { "The build failed. Please check the logs for details." })
          "@

          echo $summary >> $env:GITHUB_STEP_SUMMARY
