name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  credential-scan:
    name: Scan Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for hardcoded passwords
        shell: bash
        run: |
          echo "Scanning for hardcoded credentials..."
          FOUND=0

          # Check for common password patterns
          if grep -rn "password\s*=\s*\"[^\"]\"" --include="*.cs" --include="*.config" --include="*.json" --include="*.xml" . 2>/dev/null; then
            echo "::warning::Possible hardcoded password found"
            FOUND=1
          fi

          # Check for connection strings with credentials
          if grep -rn "Server=.*Password=" --include="*.cs" --include="*.config" --include="*.json" . 2>/dev/null; then
            echo "::warning::Possible connection string with credentials found"
            FOUND=1
          fi

          # Check for API keys
          if grep -rn "api[_-]key\s*=\s*\"" --include="*.cs" --include="*.config" --include="*.json" . 2>/dev/null; then
            echo "::warning::Possible API key found"
            FOUND=1
          fi

          # Check for tokens
          if grep -rn "token\s*=\s*\"[A-Za-z0-9_-]\{20,\}\"" --include="*.cs" --include="*.config" --include="*.json" . 2>/dev/null; then
            echo "::warning::Possible token found"
            FOUND=1
          fi

          if [ $FOUND -eq 0 ]; then
            echo "No hardcoded credentials found."
          fi
