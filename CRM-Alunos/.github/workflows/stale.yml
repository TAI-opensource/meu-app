name: Stale Issues & PRs

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Clean Stale
    runs-on: ubuntu-latest

    steps:
      - name: Close stale issues
        uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity."
          close-issue-message: "Closed due to inactivity. Feel free to reopen if still relevant."
          stale-pr-message: "This PR has been automatically marked as stale."
          close-pr-message: "Closed due to inactivity."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,security"
